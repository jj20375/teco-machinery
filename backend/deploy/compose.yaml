# 東元智慧環境監控 — 正式/開發共用 compose
# 執行方式（在 backend/deploy 目錄下）：
#   docker compose up -d --build          # 全部啟動
#   docker compose up -d --build api      # 只啟動/重建 api（連同它依賴的 mariadb）
#   docker compose up -d --build web      # 只啟動/重建前台網站
# 現場 VM 部署：專案 rsync 到 VM 後 SSH 進去在這個目錄執行（不能用 docker context 從 Mac
# 遠端 up——bind mount 會去 VM 上找路徑，掛到空資料夾）。見 docs/正式機首次部署手冊.md。
#
# 連線位址：
#   前台網站：http://<主機 IP>:8081（對區網開放——部署到現場 VM 後，Windows 主機與現場電腦
#             都要能打開網站；前台戰情室不用登入，若區網有不相干的人，用 VM 的 ufw 限制來源網段）
#   API 直連：http://localhost:8082（只綁 127.0.0.1；外部一律經過網站的 /api/* 反代，不需要直連）
#   MariaDB：127.0.0.1:3307（只綁 127.0.0.1，給本機 GUI 工具用），或 docker compose exec mariadb ...
#
# 環境變數由 .env（同目錄，不進版控）提供機密值：DB_ROOT_PASSWORD、DB_APP_PASSWORD、
# INTERNAL_TOKEN、JWT_SIGNING_KEY。範例見 .env.example。

# 明確指定專案名稱，容器/網路/volume 才會叫 teco-iot-area-*，不會被資料夾名稱（deploy）帶偏。
name: teco-iot-area

# Docker 預設的 json-file log 沒有大小上限，Collector 連不到設備時會持續重試並記錄，
# 放著不管會把 VM 的磁碟吃滿。Docker 只能限制大小、不能限制天數：每個服務最多
# 5 個 × 20MB＝100MB，四個服務合計約 400MB，超過自動刪掉最舊的。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    # 記憶體上限：單一服務出問題最多只會自己被重啟，不會拖垮整台 VM（VM 約 10 GB；資料庫實際用量遠低於此）
    mem_limit: 1g
    logging: *default-logging
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?請在 .env 設定 DB_ROOT_PASSWORD}
      MARIADB_APP_PASSWORD: ${DB_APP_PASSWORD:?請在 .env 設定 DB_APP_PASSWORD}
      MARIADB_DATABASE: teco_hvac
      TZ: Asia/Taipei
    volumes:
      # 沒設 DB_DATA_DIR（開發機）：用具名 volume mariadb-data。
      # 現場 VM 設成獨立資料碟上的路徑（例如 /srv/teco-data/mariadb），VM 系統碟壞掉或被砍時
      # 資料碟還能掛到新 VM 上。見 docs/正式機首次部署手冊.md 附錄 C。
      - ${DB_DATA_DIR:-mariadb-data}:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
      - ./mariadb/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:3307:3306"   # 給本機 GUI 工具（TablePlus/Navicat 等）用；只綁 127.0.0.1，不對外網開放
    networks: [teco-internal]

  collector:
    build:
      context: ..
      dockerfile: deploy/collector.Dockerfile
    restart: unless-stopped
    # 記憶體上限，理由同 mariadb
    mem_limit: 512m
    logging: *default-logging
    environment:
      TZ: Asia/Taipei
      ASPNETCORE_ENVIRONMENT: Production
      TecoDb__ConnectionString: "Server=mariadb;Port=3306;Database=teco_hvac;User=teco_app;Password=${DB_APP_PASSWORD};TreatTinyAsBoolean=false;"
      Collector__Hanbell__Ip: ${HANBELL_IP:-192.168.10.198}
      Collector__Hanbell__Port: ${HANBELL_PORT:-4196}
      Collector__Hanbell__BaudRate: ${HANBELL_BAUD:-9600}
      Collector__Ddc1__Ip: ${DDC1_IP:-192.168.10.12}
      Collector__Ddc1__Port: ${DDC1_PORT:-502}
      Collector__Ddc2__Ip: ${DDC2_IP:-192.168.10.14}
      Collector__Ddc2__Port: ${DDC2_PORT:-502}
      Collector__ApiBaseUrl: "http://api:8080"
      Collector__InternalToken: ${INTERNAL_TOKEN:?請在 .env 設定 INTERNAL_TOKEN}
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - teco-internal
      - teco-field   # 接現場 192.168.10.0/24 網段的網路（見 host-setup）

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    # 記憶體上限，理由同 mariadb
    mem_limit: 1g
    logging: *default-logging
    environment:
      TZ: Asia/Taipei
      ASPNETCORE_ENVIRONMENT: Production
      TecoDb__ConnectionString: "Server=mariadb;Port=3306;Database=teco_hvac;User=teco_app;Password=${DB_APP_PASSWORD};TreatTinyAsBoolean=false;"
      Collector__InternalToken: ${INTERNAL_TOKEN:?請在 .env 設定 INTERNAL_TOKEN}
      Jwt__Issuer: teco-hvac-api
      Jwt__Audience: teco-hvac-clients
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?請在 .env 設定 JWT_SIGNING_KEY（至少 32 字元）}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:4321}
      # 原始讀值保留天數，留空用預設（FCU 90、冰水主機 180）；低於 30 會被 API 拒絕並退回預設值
      Retention__FcuDays: ${RETENTION_FCU_DAYS:-}
      Retention__ChillerDays: ${RETENTION_CHILLER_DAYS:-}
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:8082:8080"   # 本機直連 API，不用經過 Caddy；只綁 127.0.0.1，不對外網開放
    networks: [teco-internal]

  web:
    image: caddy:2
    restart: unless-stopped
    # 記憶體上限，理由同 mariadb（Caddy 只做反向代理與靜態檔）
    mem_limit: 128m
    logging: *default-logging
    ports:
      - "8081:80"    # 前台網站，區網用 http://<主機 IP>:8081；對外唯一入口（/api、/hubs 由 Caddy 反代），不佔用 80/443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../dist:/srv/dist:ro   # 前端 Astro build 輸出在專案根目錄，不是 backend/ 底下
      - caddy-data:/data
    depends_on:
      api:
        condition: service_healthy
    networks: [teco-internal]

networks:
  teco-internal:
    driver: bridge
  teco-field:
    driver: bridge
    # 現場網段。若容器需要直接路由到 192.168.10.0/24，依 host-setup/01 的 vSwitch 設定，
    # 這裡通常維持一般 bridge + NAT 即可（VM 本身已在該網段），除非改用 macvlan。

volumes:
  mariadb-data:
  caddy-data:
